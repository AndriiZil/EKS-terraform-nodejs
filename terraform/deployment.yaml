apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumino-backend
  labels:
    app: lumino-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lumino-backend
  template:
    metadata:
      labels:
        app: lumino-backend
    spec:
      containers:
      - name: lumino-backend
        # Replace ACCOUNT_ID and REGION with your actual values
        image: ACCOUNT_ID.dkr.ecr.REGION.amazonaws.com/lumino-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: lumino-backend-service
spec:
  selector:
    app: lumino-backend
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
  type: ClusterIP 